name: RC1 independent verification

# Safe diagnostic branch only. No credentials, invoices, deploys or Telegram actions.
on:
  push:
    branches:
      - ops/rc1-safe-preflight-20261104

permissions:
  contents: read

concurrency:
  group: rc1-independent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run validate:catalog
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-p0.txt
      - name: No external credentials or real Telegram calls
        run: python scripts/run_backend_tests.py
        env:
          KETO_LOAD_DOTENV: '0'
          APP_STAGE: test
          PAYMENT_MODE: disabled
          PAYMENTS_ENABLED: '0'

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify Compose structure (no servers created)
        run: TELEGRAM_BOT_TOKEN=synthetic docker compose -f deploy/compose.yaml config --quiet
      - name: Docker production image build only (no deployment)
        run: docker build -f deploy/Dockerfile --tag keto-balance-rc1-audit:local .
