name: CI

on:
  push:
    branches:
      - master
      - 'feat/**'
      - 'release/**'
      - 'docs/**'
  pull_request:
    branches:
      - master
      - 'feat/**'
      - 'release/**'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Tests & P0 Security Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 227 Backend Tests
        run: |
          python scripts/run_backend_tests.py

      - name: Run Agent Ops Unit Tests
        run: |
          python -m unittest tests.backend.test_agent_ops

      - name: Run Cloud.ru 11-Service Teardown Audit Unit Tests
        run: |
          python -m unittest tests.backend.test_cloudru_teardown

  test-frontend:
    name: Frontend Tests & TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: |
          npm ci

      - name: Run TypeScript Typecheck
        run: |
          npm run typecheck

      - name: Run 195 Frontend Unit Tests
        run: |
          npm run test:unit
