name: CI

on:
  push:
    branches:
      - master
      - 'feat/**'
      - 'release/**'
      - 'docs/**'
  pull_request:
    branches:
      - master
      - 'feat/**'
      - 'release/**'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Tests, Production Boundaries & P0 Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Test Suite (227 tests)
        run: |
          python scripts/run_backend_tests.py

      - name: Run Agent Ops Unit Tests
        run: |
          python -m unittest tests.backend.test_agent_ops

      - name: Run Cloud.ru 11-Service Teardown Audit Unit Tests
        run: |
          python -m unittest tests.backend.test_cloudru_teardown

      - name: Verify Production Payment Boundaries
        run: |
          python -m unittest tests.backend.test_production_payment_boundaries

      - name: Verify Release Boundaries
        run: |
          python -m unittest tests.backend.test_release_boundaries

  frontend-checks:
    name: Frontend Tests, Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: |
          npm ci

      - name: Validate Recipe Catalog & Keto-Engine Macros
        run: |
          npm run validate:catalog

      - name: Run TypeScript Typecheck
        run: |
          npm run typecheck

      - name: Run Frontend Unit Tests (195 tests)
        run: |
          npm run test:unit

      - name: Production Build (Vite, Rollup & Release Stamp)
        run: |
          npm run build

  deploy-spec-checks:
    name: Docker Compose Production Deployment Specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Production Docker Compose Specification
        run: |
          docker compose --env-file .env.production.example config

      - name: Validate Emergency Migration Docker Compose Specification
        run: |
          docker compose -f deploy/docker-compose.migration.yml config
